services:
  postgres:
    image: postgres:17
    container_name: wma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wma_user
      POSTGRES_PASSWORD: wma_password
      POSTGRES_DB: wma_tank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wma_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

volumes:
  postgres_data: